modeling_v2: require
disable_mm_encoder: true
max_seq_len: 8192
max_input_len: 8192
max_batch_size: 128
max_num_tokens: 32768
enable_chunked_prefill: true
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64, 96, 128]
  enable_padding: true
kv_cache_config:
  enable_block_reuse: false
  mamba_ssm_cache_dtype: float32
  max_tokens: 327680
  free_gpu_memory_fraction: 0.75
speculative_config:
  decoding_type: MTP
  max_draft_len: 3
